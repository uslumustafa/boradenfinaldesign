# Bu dosya üretilir — elle değiştirmeyin: node scripts/render-config.mjs (kaynak: vercel.json).
# Müşteri önizlemesi (Render, statik site): Türkiye'den *.vercel.app açılmıyor, *.onrender.com açılıyor. Ayrıntı: docs/RENDER.md
services:
  - type: web
    runtime: static
    name: boraden-onizleme
    branch: main
    autoDeployTrigger: commit
    buildCommand: "npm ci --ignore-scripts --no-audit --no-fund && npm run build:prod"
    staticPublishPath: "./dist"
    buildFilter:
      ignoredPaths:
        - "docs/**"
        - "tests/**"
        - ".github/**"
        - "README.md"
        - "WAGTAIL_MAP.md"
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: SKIP_INSTALL_DEPS
        value: "true"
    headers:
      - path: "/*"
        name: "X-Content-Type-Options"
        value: "nosniff"
      - path: "/*"
        name: "Referrer-Policy"
        value: "strict-origin-when-cross-origin"
      - path: "/*"
        name: "X-Frame-Options"
        value: "SAMEORIGIN"
      - path: "/*"
        name: "Cross-Origin-Opener-Policy"
        value: "same-origin"
      - path: "/*"
        name: "Permissions-Policy"
        value: "camera=(), microphone=(), geolocation=(), payment=(), usb=(), browsing-topics=()"
      - path: "/*"
        name: "Content-Security-Policy"
        value: "default-src 'self'; script-src 'self' 'sha256-DCxI4h1M8IK7Oc1ZtMdFRL4dmvpa0L6sabORd2TvzZE='; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; media-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self' mailto:; frame-ancestors 'self'; upgrade-insecure-requests"
      - path: "/*"
        name: "X-Robots-Tag"
        value: "noindex, nofollow"
      - path: "/assets/js/chunks/*"
        name: "Cache-Control"
        value: "public, max-age=31536000, immutable"
      - path: "/assets/fonts/*.woff2"
        name: "Cache-Control"
        value: "public, max-age=31536000, immutable"
      - path: "/assets/img/*"
        name: "Cache-Control"
        value: "public, max-age=86400"
      - path: "/assets/video/*"
        name: "Cache-Control"
        value: "public, max-age=86400"
      - path: "/assets/documents/*"
        name: "Cache-Control"
        value: "public, max-age=86400"
    routes:
